name: Hammer Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hammer-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/hammer'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: anvia-hq/hammer@release/v1
        with:
          model: openai-compatible/muse-spark-1.3-contributor
          base-url: ${{ vars.MUSE_BASE_URL }}
          api-key: ${{ secrets.MUSE_API_KEY }}
