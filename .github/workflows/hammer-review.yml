name: Hammer Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    concurrency:
      group: hammer-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    if: >
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/hammer'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: anvia-hq/hammer@v1
        with:
          client: openai-compatible
          model: ${{ vars.OPENAI_COMPATIBLE_MODEL || secrets.OPENAI_COMPATIBLE_MODEL }}
          base-url: ${{ vars.OPENAI_COMPATIBLE_BASEURL || secrets.OPENAI_COMPATIBLE_BASEURL }}
          native-json-schema: "false"
          api-key: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
