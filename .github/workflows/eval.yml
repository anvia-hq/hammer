name: Model evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Reviewer provider/model-id.
        required: true
        type: string
      judge_model:
        description: Independent judge provider/model-id.
        required: true
        type: string
      verify:
        description: Enable the verification pass.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: |
          args=(--model "$REVIEW_MODEL" --judge-model "$JUDGE_MODEL")
          if [ "$VERIFY" = "false" ]; then args+=(--no-verify); fi
          pnpm eval "${args[@]}"
        env:
          REVIEW_MODEL: ${{ inputs.model }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          VERIFY: ${{ inputs.verify }}
          HAMMER_API_KEY: ${{ secrets.HAMMER_API_KEY }}
          HAMMER_JUDGE_API_KEY: ${{ secrets.HAMMER_JUDGE_API_KEY }}
      - if: always()
        run: |
          if [ -f eval/reports/live/report.md ]; then
            cat eval/reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
