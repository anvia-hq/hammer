name: Model evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: Reviewer provider/model-id.
        required: true
        type: string
      base_url:
        description: Reviewer OpenAI-compatible base URL.
        type: string
        required: false
      judge_base_url:
        description: Judge OpenAI-compatible base URL.
        type: string
        required: false
      judge_model:
        description: Independent judge provider/model-id.
        required: true
        type: string
      concurrency:
        description: Independent cases to evaluate at once (1 through 8).
        type: number
        default: 1
      native_json_schema:
        description: Use native JSON schema for compatible endpoints.
        type: boolean
        default: true
      verify:
        description: Enable the verification pass.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: |
          args=(--model "$REVIEW_MODEL" --judge-model "$JUDGE_MODEL" --concurrency "$EVAL_CONCURRENCY")
          if [ -n "$REVIEW_BASE_URL" ]; then args+=(--base-url "$REVIEW_BASE_URL"); fi
          if [ -n "$JUDGE_BASE_URL" ]; then args+=(--judge-base-url "$JUDGE_BASE_URL"); fi
          if [ "$NATIVE_JSON_SCHEMA" = "false" ]; then args+=(--no-native-json-schema); fi
          if [ "$VERIFY" = "false" ]; then args+=(--no-verify); fi
          pnpm eval "${args[@]}"
        env:
          REVIEW_MODEL: ${{ inputs.model }}
          EVAL_CONCURRENCY: ${{ inputs.concurrency }}
          REVIEW_BASE_URL: ${{ inputs.base_url }}
          JUDGE_BASE_URL: ${{ inputs.judge_base_url }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          VERIFY: ${{ inputs.verify }}
          NATIVE_JSON_SCHEMA: ${{ inputs.native_json_schema }}
          HAMMER_API_KEY: ${{ secrets.HAMMER_API_KEY }}
          HAMMER_JUDGE_API_KEY: ${{ secrets.HAMMER_JUDGE_API_KEY }}
      - if: always()
        run: |
          if [ -f eval/reports/live/report.md ]; then
            cat eval/reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
